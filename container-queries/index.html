<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="expect" />
    <link href="../shared/styles/style.css" rel="stylesheet" />
    <link href="./styles/style.css" rel="stylesheet" />
    <link href="../shared/icons/favicon.svg" type="image/svg+xml" rel="icon" />
    <title>Demos - Grid Lanes (Masonry)</title>
  </head>
  <body>
    <div class="layout">
      <header class="layout__header header">
        <div class="header__wrapper">
          <h1 class="header__title">Container Queries</h1>
          <a class="header__back" href="../index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20">
              <use href="../shared/icons/sprite.svg#arrow-back"></use>
            </svg>
            <span>Go to Home</span>
          </a>
        </div>

        <span>powered by luananxd</span>
      </header>

      <main class="layout__content food">
        <div class="food__grid"></div>
      </main>

      <template id="card">
        <div class="food__card card">
          <div class="card__inner">
            <img class="card__icon" src="./assets/tomato.png" />

            <svg
              class="card__favorite"
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
            >
              <use href="../shared/icons/sprite.svg#star" />
            </svg>

            <div class="card__info">
              <div class="card__wrapper">
                <span class="card__title">Tomato</span>
                <span class="card__price">
                  <output>$10/</output>
                  <small>kg</small>
                </span>
              </div>
              <button class="card__button" type="button">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28">
                  <use href="../shared/icons/sprite.svg#cart" />
                </svg>
              </button>
            </div>
          </div>
        </div>
      </template>

      <footer class="layout__footer footer">
        <h2 class="footer__title">Useful links</h2>

        <ul class="footer__resources">
          <li class="footer__resource">
            <a
              href="https://developer.mozilla.org/en-US/docs/Web/CSS/Guides/Grid_layout/Masonry_layout"
            >
              Masonry layout (MDN)
            </a>
          </li>

          <li class="footer__resource">
            <a href="https://habr.com/ru/articles/979374/">
              Новое слово в CSS: Grid Lanes (Habr)
            </a>
          </li>
        </ul>
      </footer>
    </div>
  </body>

  <script src="./scripts/main.js" type="module"></script>
</html>
