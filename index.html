<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="expect" />
    <link href="./shared/styles/style.css" rel="stylesheet" />
    <link href="./shared/styles/view-transition.css" rel="stylesheet" />
    <link href="./shared/styles/home.css" rel="stylesheet" />
    <link href="./shared/icons/favicon.svg" rel="icon" type="image/svg+xml" />
    <title>Demos - Home</title>
  </head>
  <body>
    <div class="layout">
      <header class="layout__header header">
        <div class="header__wrapper">
          <h1 class="header__title">Demos</h1>
          <span class="header__caption">based on frontend articles</span>
        </div>

        <span>powered by luananxd</span>
      </header>

      <main class="layout__content home"></main>
    </div>
  </body>

  <template id="card">
    <a class="home__card" href="" data-el="link">
      <span class="home__browsers">
        <svg class="home__browser-icon" widht="24" height="24" data-el="chrome">
          <use href="./shared/icons/logos.svg#chrome-simple"></use>
        </svg>

        <svg
          class="home__browser-icon"
          widht="24"
          height="24"
          data-el="firefox"
        >
          <use href="./shared/icons/logos.svg#firefox-simple"></use>
        </svg>

        <svg class="home__browser-icon" widht="24" height="24" data-el="safari">
          <use href="./shared/icons/logos.svg#safari-simple"></use>
        </svg>
      </span>

      <span class="home__title" data-el="title"></span>
    </a>
  </template>

  <script>
    const list = document.querySelector(".home");
    const template = document.querySelector("#card");

    const cards = [
      {
        title: "Cross Document Transition",
        link: "./cross-document-view-transition/index.html",
        supportedBrowsers: {
          chrome: true,
          firefox: false,
          safari: true,
        },
      },
      {
        title: "View Transition Dialog",
        link: "./view-transition-dialog/index.html",
        supportedBrowsers: {
          chrome: true,
          firefox: true,
          safari: true,
        },
      },
      {
        title: "View Transition List",
        link: "./view-transition-list/index.html",
        supportedBrowsers: {
          chrome: true,
          firefox: true,
          safari: true,
        },
      },
      {
        title: "CSS Color Spaces",
        link: "./css-color-spaces/index.html",
        supportedBrowsers: {
          chrome: true,
          firefox: true,
          safari: true,
        },
      },
      {
        title: "Color Mix",
        link: "./color-mix/index.html",
        supportedBrowsers: {
          chrome: true,
          firefox: true,
          safari: true,
        },
      },
      {
        title: "CSS Logical Properties",
        link: "./css-logical-properties/index.html",
        supportedBrowsers: {
          chrome: true,
          firefox: true,
          safari: true,
        },
      },
      {
        title: "Grid Lanes (Masonry)",
        link: "./grid-lanes/index.html",
        supportedBrowsers: {
          chrome: false,
          firefox: false,
          safari: true,
        },
      },
      {
        title: "CSS Container Queries",
        link: "./container-queries/index.html",
        supportedBrowsers: {
          chrome: true,
          firefox: true,
          safari: true,
        },
      },
      {
        title: "Indexed DB",
        link: "./indexed-db/index.html",
        supportedBrowsers: {
          chrome: true,
          firefox: true,
          safari: true,
        },
      },
      {
        title: "CSS Carousel",
        link: "./css-carousel/index.html",
        supportedBrowsers: {
          chrome: true,
          firefox: false,
          safari: false,
        },
      },
    ];

    function createCard(data) {
      const card = template.content.cloneNode(true);

      const wrapper = card.querySelector('[data-el="link"]');
      const title = card.querySelector('[data-el="title"]');
      const chromeIcon = card.querySelector('[data-el="chrome"]');
      const firefoxIcon = card.querySelector('[data-el="firefox"]');
      const safariIcon = card.querySelector('[data-el="safari"]');

      wrapper.setAttribute("href", data.link);
      title.textContent = data.title;

      if (!data.supportedBrowsers.chrome) {
        chromeIcon.classList.add("home__browser-icon--unable");
      }

      if (!data.supportedBrowsers.firefox) {
        firefoxIcon.classList.add("home__browser-icon--unable");
      }

      if (!data.supportedBrowsers.safari) {
        safariIcon.classList.add("home__browser-icon--unable");
      }

      return card;
    }

    function renderCards(cards) {
      cards.forEach((data) => {
        const card = createCard(data);
        list.append(card);
      });
    }

    renderCards(cards);
  </script>
</html>
