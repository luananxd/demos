<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="expect" />
    <link href="../shared/styles/style.css" rel="stylesheet" />
    <link href="./styles/style.css" rel="stylesheet" />
    <link href="../shared/icons/favicon.svg" type="image/svg+xml" rel="icon" />
    <title>Demos - CSS Carousel</title>
  </head>
  <body>
    <div class="layout">
      <header class="layout__header header">
        <div class="header__wrapper">
          <h1 class="header__title">Demos - CSS Carousel</h1>
          <a class="header__back" href="../index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20">
              <use href="../shared/icons/sprite.svg#arrow-back"></use>
            </svg>
            <span>Go to Home</span>
          </a>
        </div>

        <span>powered by luananxd</span>
      </header>

      <main class="layout__content">
        <div class="carousel">
          <ul class="carousel__body">
            <li class="carousel__item">
              <img src="./assets/dog_1.png" alt="Dog 1" />
            </li>

            <li class="carousel__item">
              <img src="./assets/dog_2.png" alt="Dog 2" />
            </li>

            <li class="carousel__item">
              <img src="./assets/dog_3.png" alt="Dog 3" />
            </li>

            <li class="carousel__item">
              <img src="./assets/dog_4.png" alt="Dog 4" />
            </li>

            <li class="carousel__item">
              <img src="./assets/dog_5.png" alt="Dog 5" />
            </li>

            <li class="carousel__item">
              <img src="./assets/dog_6.png" alt="Dog 6" />
            </li>

            <li class="carousel__item">
              <img src="./assets/dog_6.png" alt="Dog 6" />
            </li>
          </ul>
        </div>
      </main>

      <footer class="layout__footer footer">
        <h2 class="footer__title">Useful links</h2>

        <ul class="footer__resources"></ul>
      </footer>
    </div>
  </body>

  <script src="./scripts/main.js" type="module"></script>
</html>
